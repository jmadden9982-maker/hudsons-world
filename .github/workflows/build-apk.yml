name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Test and build web app
        run: npm run check

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping add"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Use the shared debug keystore
        # Every build must be signed with the SAME debug key, or Android
        # refuses to install a new build over an older one ("update
        # incompatible"). Gradle's default debug signing config already
        # looks for ~/.android/debug.keystore, so dropping our checked-in
        # one there (instead of whatever ephemeral key the runner would
        # otherwise generate) is enough — no build.gradle changes needed.
        run: |
          mkdir -p ~/.android
          cp .github/keystores/debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hudsons-world-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish rolling APK release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-apk
          name: "Hudson's World APK (build ${{ github.sha }})"
          body: |
            Automatically rebuilt from commit ${{ github.sha }} on ${{ github.ref_name }}.

            Install this APK to play. Because this is a sideloaded app (not
            from the Play Store), Android will never install an update
            silently — but every push to main refreshes this same link, so
            re-downloading and tapping install always gets you the latest
            build. The game's Settings screen has a "Check for Updates"
            button that tells you when a newer build than the one you're
            running is available here.
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
